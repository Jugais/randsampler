[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mlsampler"
version = "0.4.0"
description = "Flexible constrained random sampler for doe sampling or reverse analysis in machine learning"
authors = [
  { name="Jugai O" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "joblib"
]

license = { text= "LICENSE" }

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
docs = ["sphinx", "sphinx-rtd-theme", "scipy"]
dev = ["pytest", "scipy", "pyright"]  # [claude fixed] test infra; pyright verifies the set_constraints overloads

[tool.pytest.ini_options]
testpaths = ["tests"]